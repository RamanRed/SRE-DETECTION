---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-service
  namespace: sre-copilot
  labels:
    app: incident-service
    component: backend
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: incident-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8081"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: incident-service
      containers:
        - name: incident-service
          image: docker.io/ramanred/sre-copilot-incident-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: DB_HOST
              value: "sre-postgres-svc"
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sre-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sre-db-secret
                  key: DB_PASSWORD
            - name: DB_SSLMODE
              value: "disable"
            - name: DB_MAX_CONNS
              value: "10"
            - name: DB_MIN_CONNS
              value: "2"
            - name: AI_COPILOT_HOST
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AI_COPILOT_HOST
            - name: AI_COPILOT_PORT
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AI_COPILOT_PORT
            - name: AI_RPC_TIMEOUT
              value: "25s"
            - name: INTEGRATION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-integration-secret
                  key: INTEGRATION_ENCRYPTION_KEY
            - name: REQUIRE_INTEGRATION_ENCRYPTION_KEY
              value: "true"
            - name: DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: DEMO_MODE
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: sre-integration-secret
                  key: AUTH_SESSION_SECRET
            - name: AUTH_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sre-integration-secret
                  key: AUTH_BOOTSTRAP_PASSWORD
            - name: AUTH_BOOTSTRAP_ROLE
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AUTH_BOOTSTRAP_ROLE
            - name: AUTH_SESSION_TTL
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AUTH_SESSION_TTL
            - name: CI_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-integration-secret
                  key: CI_WEBHOOK_TOKEN
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: CORS_ALLOWED_ORIGINS
            - name: AUTOMATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AUTOMATION_ENABLED
            - name: AUTOMATION_SWEEP_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: AUTOMATION_SWEEP_INTERVAL
            - name: CI_STATUS_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: CI_STATUS_POLL_INTERVAL
            - name: CI_BUILD_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: CI_BUILD_TIMEOUT
            - name: ALLOW_PRIVATE_INTEGRATION_ENDPOINTS
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: ALLOW_PRIVATE_INTEGRATION_ENDPOINTS
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: KUBERNETES_NAMESPACE
            - name: GOMEMLIMIT
              value: "96MiB"
          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "300m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: incident-service
  namespace: sre-copilot
  labels:
    app: incident-service
spec:
  selector:
    app: incident-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
