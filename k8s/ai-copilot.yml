---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot-service
  namespace: sre-copilot
  labels:
    app: ai-copilot-service
    component: backend
    tier: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-copilot-service
  template:
    metadata:
      labels:
        app: ai-copilot-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8082"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      containers:
        - name: ai-copilot-service
          image: docker.io/ramanred/sre-copilot-ai-copilot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              name: grpc
              protocol: TCP
            - containerPort: 8082
              name: management
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:TieredStopAtLevel=1 -Xmx200m -Xms64m"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration"
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: SPRING_PROFILES_ACTIVE
            # Use GROQ's OpenAI-compatible API (secret created by Jenkins via kubectl)
            - name: SPRING_AI_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-groq-secret
                  key: GROQ_API_KEY
            - name: SPRING_AI_OPENAI_BASE_URL
              value: "https://api.groq.com/openai"
            - name: SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL
              value: "llama-3.3-70b-versatile"
            - name: SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE
              value: "0.2"
            # Ollama not deployed in K8s — Groq is the active AI backend
          resources:
            requests:
              memory: "220Mi"
              cpu:    "100m"
            limits:
              memory: "350Mi"
              cpu:    "400m"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot-service
  namespace: sre-copilot
  labels:
    app: ai-copilot-service
spec:
  selector:
    app: ai-copilot-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: management
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
