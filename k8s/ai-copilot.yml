---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-copilot-service
  namespace: sre-copilot
  labels:
    app: ai-copilot-service
    component: backend
    tier: ai-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-copilot-service
  template:
    metadata:
      labels:
        app: ai-copilot-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8082"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      containers:
        - name: ai-copilot-service
          image: docker.io/ramanred/sre-copilot-ai-copilot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              name: grpc
              protocol: TCP
            - containerPort: 8082
              name: management
              protocol: TCP
          env:
            - name: APPLICATION_NAME
              value: "ai-copilot-service"
            - name: GRPC_PORT
              value: "9090"
            - name: MANAGEMENT_PORT
              value: "8082"
            # A missing key intentionally enables deterministic heuristic mode.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sre-ai-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: OPENAI_BASE_URL
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: sre-copilot-config
                  key: OPENAI_MODEL
            - name: OPENAI_TEMPERATURE
              value: "0.2"
            - name: OPENAI_TIMEOUT
              value: "15s"
            - name: REMEDIATION_NAMESPACE
              value: "sre-copilot"
            - name: GOMEMLIMIT
              value: "96MiB"
          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "300m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-copilot-service
  namespace: sre-copilot
  labels:
    app: ai-copilot-service
spec:
  selector:
    app: ai-copilot-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: management
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
