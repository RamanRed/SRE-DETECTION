---
# Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sre-copilot
  labels:
    app.kubernetes.io/managed-by: kubectl
    project: sre-copilot
---
# ConfigMap: shared non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-copilot-config
  namespace: sre-copilot
data:
  DB_NAME:          "sredb"
  DB_PORT:          "5432"
  AI_COPILOT_HOST:  "ai-copilot-service"
  AI_COPILOT_PORT:  "9090"
  OPENAI_BASE_URL:  "https://api.groq.com/openai"
  OPENAI_MODEL:     "llama-3.3-70b-versatile"
  DEMO_MODE:        "false"
  AUTH_BOOTSTRAP_ROLE: "SRE_LEAD"
  AUTH_SESSION_TTL: "8h"
  # The browser normally uses the same-origin Nginx proxy. Add any separate
  # dashboard origins here as a comma-separated allowlist.
  CORS_ALLOWED_ORIGINS: "http://localhost"
  AUTOMATION_ENABLED: "true"
  AUTOMATION_SWEEP_INTERVAL: "30s"
  CI_STATUS_POLL_INTERVAL: "10s"
  CI_BUILD_TIMEOUT: "10m"
  # Required for trusted in-cluster CI endpoints such as
  # https://kubernetes.default.svc. Link-local/metadata targets stay blocked.
  ALLOW_PRIVATE_INTEGRATION_ENDPOINTS: "true"
  KUBERNETES_NAMESPACE: "sre-copilot"
# Runtime secrets are deliberately not committed. Create `sre-db-secret` and
# `sre-integration-secret` before deploying. The optional `sre-ai-secret`
# enables cloud inference; without it, the AI service uses its deterministic
# heuristic.
