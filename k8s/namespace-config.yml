---
# Kubernetes Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: sre-copilot
  labels:
    app.kubernetes.io/managed-by: kubectl
    project: sre-copilot
---
# ConfigMap: shared non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-copilot-config
  namespace: sre-copilot
data:
  DB_NAME:          "sredb"
  DB_PORT:          "5432"
  AI_COPILOT_HOST:  "ai-copilot-service"
  AI_COPILOT_PORT:  "9090"
  SPRING_PROFILES_ACTIVE: "kubernetes"
---
# Secret: database credentials
apiVersion: v1
kind: Secret
metadata:
  name: sre-db-secret
  namespace: sre-copilot
type: Opaque
stringData:
  DB_USERNAME: "sreuser"
  DB_PASSWORD: "srepassword"
---
# Secret: Groq API Key
# In Jenkins pipeline this is created from the 'groq-api-key' credential.
# For manual deploy run:
#   kubectl create secret generic sre-groq-secret \
#     --from-literal=GROQ_API_KEY=<your-key> -n sre-copilot --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: sre-groq-secret
  namespace: sre-copilot
type: Opaque
stringData:
  GROQ_API_KEY: "REPLACE_WITH_GROQ_API_KEY_FROM_JENKINS"
