---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-service
  namespace: sre-copilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-service-ci-runner
  namespace: sre-copilot
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-service-ci-runner
  namespace: sre-copilot
subjects:
  - kind: ServiceAccount
    name: incident-service
    namespace: sre-copilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-service-ci-runner
