# SonarCloud configuration for incident-service
sonar.projectKey=ramanred_sre-copilot-incident-service
sonar.projectName=sre-copilot-incident-service
sonar.organization=ramanred

sonar.host.url=https://sonarcloud.io

# Go source, tests, and coverage
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/gen/**,**/vendor/**
sonar.go.coverage.reportPaths=coverage.out
sonar.cpd.exclusions=**/gen/**

sonar.sourceEncoding=UTF-8
