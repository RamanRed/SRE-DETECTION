# SonarCloud configuration for incident-service
sonar.projectKey=ramanred_sre-copilot-incident-service
sonar.projectName=sre-copilot-incident-service
sonar.organization=ramanred

sonar.host.url=https://sonarcloud.io

# Source and test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# JaCoCo coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/generated/**,**/target/**,**/*Proto*.java
sonar.cpd.exclusions=**/dto/**

sonar.java.source=17
sonar.sourceEncoding=UTF-8
