server:
  port: 8081

spring:
  application:
    name: incident-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sredb}
    username: ${DB_USERNAME:sreuser}
    password: ${DB_PASSWORD:srepassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: IncidentServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

grpc:
  client:
    ai-copilot-service:
      address: dns:///ai-copilot-service:9090
      negotiation-type: PLAINTEXT
      enable-keep-alive: true
      keep-alive-time: 60s
      keep-alive-timeout: 10s
      # Override for local Docker Compose
      # address: dns:///${AI_COPILOT_HOST:ai-copilot-service}:${AI_COPILOT_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO
    com.devops.incident: DEBUG
    net.devh.boot.grpc: INFO
    org.hibernate.SQL: DEBUG
