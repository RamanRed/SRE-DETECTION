server:
  port: 8082

spring:
  application:
    name: ai-copilot-service
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
  ai:
    openai:
      # Supports OpenAI and GROQ (OpenAI-compatible). Override via env:
      # SPRING_AI_OPENAI_API_KEY, SPRING_AI_OPENAI_BASE_URL, SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL
      api-key: ${SPRING_AI_OPENAI_API_KEY:demo-key}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:0.2}
    ollama:
      # Optional local Ollama. Defaults to localhost so it won't block startup.
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${SPRING_AI_OLLAMA_MODEL:qwen2.5-coder:1.5b}
          temperature: 0.2

grpc:
  server:
    port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ai.triage.inference: true

logging:
  level:
    root: INFO
    com.devops.copilot: DEBUG
    net.devh.boot.grpc: INFO
