# SonarCloud configuration for ai-copilot-service
sonar.projectKey=ramanred_sre-copilot-ai-copilot
sonar.projectName=sre-copilot-ai-copilot
sonar.organization=ramanred

sonar.host.url=https://sonarcloud.io

# Source and test paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Exclusions — exclude auto-generated Protobuf stubs
sonar.exclusions=**/generated/**,**/target/**,**/*Proto*.java,**/grpc/**
sonar.cpd.exclusions=**/service/**

sonar.java.source=17
sonar.sourceEncoding=UTF-8
