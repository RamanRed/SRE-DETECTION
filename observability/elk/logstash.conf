input {
  beats {
    port => 5044
    tags => ["docker_logs"]
  }
}

filter {

  # ── Parse Spring Boot JSON log format ──────────────────────────────────
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "spring_log"
    }
    mutate {
      rename => {
        "[spring_log][level]"       => "log_level"
        "[spring_log][logger_name]" => "logger"
        "[spring_log][message]"     => "log_message"
        "[spring_log][thread_name]" => "thread"
      }
    }
  }

  # ── Detect stack traces ─────────────────────────────────────────────────
  if [log_message] =~ /Exception|Error|FATAL/ {
    mutate {
      add_tag => ["error", "requires_triage"]
      add_field => { "alert_level" => "HIGH" }
    }
  }

  # ── Extract service name from Docker container metadata ────────────────
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # ── Add environment label ───────────────────────────────────────────────
  mutate {
    add_field => { "environment" => "production" }
    add_field => { "platform"    => "sre-copilot" }
  }

  # ── Remove noisy/verbose debug fields ──────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "spring_log"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "sre-copilot-logs-%{+YYYY.MM.dd}"
    user     => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
  }

  # Also send high-severity errors to stdout for debugging
  if "error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}
