input {
  beats {
    port => 5044
    tags => ["docker_logs"]
  }
}

filter {

  # ── Parse Go slog JSON emitted by both backend services ────────────────
  if [message] =~ /^\{/ {
    json {
      source  => "message"
      target  => "go_log"
    }
    mutate {
      rename => {
        "[go_log][time]"    => "log_time"
        "[go_log][level]"   => "log_level"
        "[go_log][msg]"     => "log_message"
        "[go_log][source]"  => "logger"
        "[go_log][service]" => "service_name"
        "[go_log][error]"   => "error_message"
      }
    }
  }

  # ── Detect stack traces ─────────────────────────────────────────────────
  if [log_level] =~ /(?i)error|fatal/ or [log_message] =~ /(?i)panic|error|fatal/ or [error_message] {
    mutate {
      add_tag => ["error", "requires_triage"]
      add_field => { "alert_level" => "HIGH" }
    }
  }

  # ── Fall back to Docker/Kubernetes container metadata for service name ─
  if ![service_name] and [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # ── Add environment label ───────────────────────────────────────────────
  mutate {
    add_field => { "environment" => "demo" }
    add_field => { "platform"    => "sre-copilot" }
  }

  # ── Remove noisy/verbose debug fields ──────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "go_log"]
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "sre-copilot-logs-%{+YYYY.MM.dd}"
    # Supply both values through the deployment secret mechanism. There is no
    # committed fallback password.
    user     => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
  }

  # Also send high-severity errors to stdout for debugging
  if "error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}
