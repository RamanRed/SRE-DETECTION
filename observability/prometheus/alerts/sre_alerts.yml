groups:
  - name: sre_copilot_alerts
    interval: 30s
    rules:

      # ── SLO: AI Triage P95 Latency > 1.5s ────────────────────────────────
      - alert: AiTriageP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_triage_inference_seconds_bucket[5m])) by (le, application)
          ) > 1.5
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "AI Triage P95 Latency SLO Breach"
          description: "AI inference P95 latency is {{ $value | humanizeDuration }}  — exceeds 1.5s SLO threshold."
          runbook: "https://github.com/RamanRed/SRE-DETECTION/blob/master/README.md"

      # ── Incident Service 5xx Error Rate > 5% ─────────────────────────────
      - alert: IncidentServiceHighErrorRate
        expr: |
          sum(rate(http_server_requests_total{application="incident-service",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_total{application="incident-service"}[5m])), 0.001) > 0.05
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Incident Service 5xx error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # ── pgx Connection Pool Waiters ───────────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          increase(
            db_pool_empty_acquire_total{application="incident-service"}[2m]
          ) > 5
          or
          max_over_time(
            db_pool_waiting_requests{application="incident-service"}[2m]
          ) > 5
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "More than five incident-service acquisitions had to wait for a database connection in the last two minutes."

      # ── Go service container memory > ~85% of the 128 Mi limit ────────────
      - alert: GoServiceMemoryHigh
        expr: |
          container_memory_working_set_bytes{
            namespace="sre-copilot",
            container=~"incident-service|ai-copilot-service"
          } > 115343360
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Go service memory is near its pod limit"
          description: "{{ $labels.pod }}/{{ $labels.container }} is using {{ $value | humanize1024 }}B of its 128 Mi limit."

      # ── Pod Restart Spike ─────────────────────────────────────────────────
      - alert: PodFrequentRestarts
        expr: |
          changes(
            (max by (namespace, pod, container) (
              container_start_time_seconds{namespace="sre-copilot",container!=""}
            ))[15m:1m]
          ) > 3
        for: 0m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "{{ $value }} restarts in the last 15 minutes."
