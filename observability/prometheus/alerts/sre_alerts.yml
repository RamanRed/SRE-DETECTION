groups:
  - name: sre_copilot_alerts
    interval: 30s
    rules:

      # ── SLO: AI Triage P95 Latency > 1.5s ────────────────────────────────
      - alert: AiTriageP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_triage_inference_seconds_bucket[5m])) by (le, application)
          ) > 1.5
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "AI Triage P95 Latency SLO Breach"
          description: "AI inference P95 latency is {{ $value | humanizeDuration }}  — exceeds 1.5s SLO threshold."
          runbook: "https://github.com/your-org/sre-copilot/blob/main/docs/runbook.md#ai-latency"

      # ── Incident Service 5xx Error Rate > 5% ─────────────────────────────
      - alert: IncidentServiceHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="incident-service",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{application="incident-service"}[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Incident Service 5xx error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # ── HikariCP Connection Pool Exhausted ────────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          hikaricp_connections_pending{application="incident-service"} > 5
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "HikariCP connection pool nearly exhausted"
          description: "{{ $value }} threads are waiting for DB connections in pool '{{ $labels.pool }}'."

      # ── JVM Heap Usage > 85% ──────────────────────────────────────────────
      - alert: JvmHeapUsageHigh
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "JVM Heap usage > 85% on {{ $labels.application }}"
          description: "Heap is at {{ $value | humanizePercentage }}. Consider increasing pod memory limits."

      # ── Pod Restart Spike ─────────────────────────────────────────────────
      - alert: PodFrequentRestarts
        expr: |
          increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "{{ $value }} restarts in the last 15 minutes."
