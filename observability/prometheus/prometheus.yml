global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sre-copilot-monitor'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  # ── Prometheus self-monitoring ─────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Incident Service ───────────────────────────────────────────
  - job_name: 'incident-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['incident-service:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'incident-service'

  # ── AI Copilot Service ─────────────────────────────────────────
  - job_name: 'ai-copilot-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-copilot-service:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-copilot-service'

  # ── Kubernetes node metrics (K3s) ──────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ── PostgreSQL metrics ─────────────────────────────────────────
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ── Kubernetes pod discovery (K3s) ────────────────────────────
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
