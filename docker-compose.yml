# ────────────────────────────────────────────────────────────────────────────
# SRE Incident Copilot Platform — Docker Compose
# Run with: docker compose up --build
# Requires: Docker Engine 24+, Compose v2.20+
# ────────────────────────────────────────────────────────────────────────────

services:

  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sredb}
      POSTGRES_USER:     ${POSTGRES_USER:-sreuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srepassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    mem_reservation: 128m
    networks:
      - sre-net

  # ──────────────────────────────────────────
  # Local Ollama LLM (optional local AI)
  # Models: qwen2.5-coder:1.5b, llama3.2:1b
  # ──────────────────────────────────────────
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: sre-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Pull a lightweight model on first start
    # (comment out if using OpenAI/Cloud LLM)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5-coder:1.5b && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    networks:
      - sre-net

  # ──────────────────────────────────────────
  # AI Copilot & Triage Engine
  # gRPC port 9090 | HTTP management/compatibility actuator 8082
  # ──────────────────────────────────────────
  ai-copilot-service:
    build:
      context: .
      dockerfile: apps/ai-copilot-service/Dockerfile
    container_name: sre-ai-copilot
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8082:8082"
    environment:
      APPLICATION_NAME:      ai-copilot-service
      GRPC_PORT:             9090
      MANAGEMENT_PORT:       8082
      OPENAI_API_KEY:        ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL:       ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL:          ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE:    ${OPENAI_TEMPERATURE:-0.2}
      OPENAI_TIMEOUT:        ${OPENAI_TIMEOUT:-15s}
      REMEDIATION_NAMESPACE: ${REMEDIATION_NAMESPACE:-sre-copilot}
      GOMEMLIMIT:            ${AI_GOMEMLIMIT:-96MiB}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: ${AI_MEMORY_LIMIT:-128m}
    mem_reservation: 64m
    networks:
      - sre-net

  # ──────────────────────────────────────────
  # Incident & Audit Core Service
  # REST API port 8081
  # ──────────────────────────────────────────
  incident-service:
    build:
      context: .
      dockerfile: apps/incident-service/Dockerfile
    container_name: sre-incident-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INCIDENT_SERVICE_PORT:-8081}:8081"
    environment:
      SERVER_PORT:       8081
      DB_HOST:           postgres
      DB_PORT:           5432
      DB_NAME:           ${POSTGRES_DB:-sredb}
      DB_USERNAME:       ${POSTGRES_USER:-sreuser}
      DB_PASSWORD:       ${POSTGRES_PASSWORD:-srepassword}
      DB_SSLMODE:        ${DB_SSLMODE:-disable}
      DB_MAX_CONNS:      ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS:      ${DB_MIN_CONNS:-2}
      AI_COPILOT_HOST:   ai-copilot-service
      AI_COPILOT_PORT:   9090
      AI_RPC_TIMEOUT:    ${AI_RPC_TIMEOUT:-25s}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      REQUIRE_INTEGRATION_ENCRYPTION_KEY: ${REQUIRE_INTEGRATION_ENCRYPTION_KEY:-false}
      DEMO_MODE:          ${DEMO_MODE:-true}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_BOOTSTRAP_ROLE: ${AUTH_BOOTSTRAP_ROLE:-SRE_LEAD}
      AUTH_SESSION_TTL:   ${AUTH_SESSION_TTL:-8h}
      CI_WEBHOOK_TOKEN:   ${CI_WEBHOOK_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      AUTOMATION_SWEEP_INTERVAL: ${AUTOMATION_SWEEP_INTERVAL:-30s}
      CI_STATUS_POLL_INTERVAL: ${CI_STATUS_POLL_INTERVAL:-10s}
      CI_BUILD_TIMEOUT:   ${CI_BUILD_TIMEOUT:-10m}
      ALLOW_PRIVATE_INTEGRATION_ENDPOINTS: ${ALLOW_PRIVATE_INTEGRATION_ENDPOINTS:-false}
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-sre-copilot}
      GOMEMLIMIT:        ${INCIDENT_GOMEMLIMIT:-96MiB}
    depends_on:
      postgres:
        condition: service_healthy
      ai-copilot-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: ${INCIDENT_MEMORY_LIMIT:-128m}
    mem_reservation: 64m
    networks:
      - sre-net

  # ──────────────────────────────────────────
  # SRE Copilot React Frontend (Nginx)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sre-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      incident-service:
        condition: service_healthy
    healthcheck:
      # Nginx listens on IPv4 here; avoid images where localhost resolves to ::1.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    mem_reservation: 32m
    networks:
      - sre-net

# ──────────────────────────────────────────────────────────────────────────
# Networking & Volumes
# ──────────────────────────────────────────────────────────────────────────
networks:
  sre-net:
    driver: bridge
    name: sre-copilot-network

volumes:
  postgres_data:
    name: sre-postgres-data
  ollama_models:
    name: sre-ollama-models
