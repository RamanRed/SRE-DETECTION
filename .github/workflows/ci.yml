name: PR Quality Gates & Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1: Gitleaks Secret Detection (prevents API key leaks)
  # ──────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Job 2: Lint proto file
  # ──────────────────────────────────────────────────────────────────────
  proto-lint:
    name: Protobuf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
      - name: Lint proto files
        run: buf lint proto/

  # ──────────────────────────────────────────────────────────────────────
  # Job 3: Build & Test incident-service
  # ──────────────────────────────────────────────────────────────────────
  build-incident-service:
    name: Build incident-service
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test incident-service
        working-directory: apps/incident-service
        run: mvn clean verify -DskipTests=false

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incident-service-test-report
          path: apps/incident-service/target/surefire-reports/

  # ──────────────────────────────────────────────────────────────────────
  # Job 4: Build & Test ai-copilot-service
  # ──────────────────────────────────────────────────────────────────────
  build-ai-copilot:
    name: Build ai-copilot-service
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test ai-copilot-service
        working-directory: apps/ai-copilot-service
        run: mvn clean verify -DskipTests=false

  # ──────────────────────────────────────────────────────────────────────
  # Job 5: Frontend lint and type check
  # ──────────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: apps/frontend
        run: npm run build
