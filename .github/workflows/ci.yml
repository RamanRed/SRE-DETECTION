name: PR Quality Gates & Security Scan

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proto-lint:
    name: Protobuf Contract & Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
      - name: Lint protobuf contract
        run: buf lint proto/
      - name: Detect breaking protobuf changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: buf breaking proto --against ".git#format=git,commit=${BASE_SHA},subdir=proto"
      - name: Verify generated Go bindings are current
        run: |
          git ls-files -z -- gen/ | xargs -0 -r rm -f
          buf generate
          generated_status=$(git status --porcelain --untracked-files=all -- gen/)
          test -z "$generated_status" || { echo "$generated_status"; exit 1; }

  go-quality:
    name: Go Format, Vet, Test & Build
    runs-on: ubuntu-latest
    needs: [gitleaks, proto-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build backend binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/incident-service ./apps/incident-service/cmd/incident-service
          CGO_ENABLED=0 go build -trimpath -o /tmp/ai-copilot ./apps/ai-copilot-service/cmd/ai-copilot
      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  frontend-check:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    needs: [gitleaks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: TypeScript type check
        working-directory: apps/frontend
        run: npx tsc --noEmit
      - name: Build production bundle
        working-directory: apps/frontend
        run: npm run build

  container-build:
    name: Build Containers & Run E2E
    runs-on: ubuntu-latest
    needs: [go-quality, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build incident-service image
        run: docker build -f apps/incident-service/Dockerfile -t sre-copilot-incident-service:ci .
      - name: Build ai-copilot image
        run: docker build -f apps/ai-copilot-service/Dockerfile -t sre-copilot-ai-copilot:ci .
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t sre-copilot-frontend:ci .
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Start heuristic-mode stack
        run: docker compose up --detach --build --wait
      - name: Run end-to-end smoke
        run: bash scripts/e2e_smoke.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop end-to-end stack
        if: always()
        run: docker compose down --volumes --remove-orphans
