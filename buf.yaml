version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Kept for wire compatibility with the established protobuf contract.
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
